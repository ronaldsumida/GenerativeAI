<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triage Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <div class="app">
        <section class="log-pane">
            <header class="pane-header">
                <h1>app.log</h1>
                <span id="log-meta" class="pane-subtitle">loading&hellip;</span>
            </header>
            <pre id="log-content" class="log-content">Loading log file&hellip;</pre>
        </section>

        <section class="chat-pane">
            <header class="pane-header">
                <h1>Triage Assistant</h1>
            </header>

            <div id="chat-messages" class="chat-messages">
                <div class="message assistant">
                    <div class="message-bubble">Hi! Ask me things like <em>&ldquo;What caused the checkout errors on July 14th?&rdquo;</em> or <em>&ldquo;Did any service slow down over the course of the week?&rdquo;</em></div>
                </div>
            </div>

            <form id="chat-form" class="chat-form">
                <textarea id="chat-input" class="chat-input" placeholder="Ask a question about the logs&hellip;" rows="2"></textarea>
                <button id="chat-send" type="submit" class="chat-send">Send</button>
            </form>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
